services:
  postgres:
    image: postgres:17-alpine
    container_name: discount-postgres
    environment:
      POSTGRES_DB: discount
      POSTGRES_USER: discount
      POSTGRES_PASSWORD: discount
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount -d discount"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Issues the JWT validated by the backend. Development mode, realm imported at startup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: discount-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/discount-realm.json:/opt/keycloak/data/import/discount-realm.json:ro
    healthcheck:
      # The image has no curl: query the management port (9000) with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
