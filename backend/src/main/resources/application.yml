# Shared configuration. Environment-specific values come from environment variables, or from a profile:
# 'local' (application-local.yml) on a developer machine, 'it' for the integration tests.
spring:
  application:
    name: discount-kata
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          # Keycloak puts the realm roles in a top-level "roles" claim (protocol mapper of the realm)
          authorities-claim-name: roles
          authority-prefix: ROLE_

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
