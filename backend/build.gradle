plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.carrefour'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	mapstructVersion = '1.6.3'
	springdocVersion = '3.1.1'
	restAssuredVersion = '6.1.0'
}

// Integration tests live in src/integrationTest, next to src/main and src/test. They reuse the test dependencies and the
// shared test helpers of src/test (creators, JSON fixtures).
sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
		// Same Keycloak realm as docker-compose, imported by the Keycloak test container
		resources.srcDir rootProject.file('keycloak')
	}
}

configurations {
	mockitoAgent
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
	integrationTestImplementation 'com.github.dasniko:testcontainers-keycloak:4.4.0'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
}

tasks.named('compileJava') {
	options.compilerArgs += ['-Amapstruct.defaultComponentModel=spring']
}

// Only the executable Spring Boot jar is built, so the Docker image picks a single jar.
tasks.named('jar') {
	enabled = false
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
	// Load Mockito as a Java agent: dynamic agent loading is deprecated since JDK 21
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

def integrationTest = tasks.register('integrationTest', Test) {
	description = 'Runs the integration tests of src/integrationTest. Requires a Docker environment for Testcontainers.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn integrationTest
}

// ./gradlew :backend:bootRun starts with the 'local' profile unless SPRING_PROFILES_ACTIVE is set.
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

jacoco {
	toolVersion = '0.8.15'
}

// Merges the coverage of unit and integration tests (also when produced by separate CI jobs).
tasks.named('jacocoTestReport', JacocoReport) {
	executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
	reports {
		xml.required = true
		html.required = true
	}
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		eclipse()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// Server URL and token are read from the SONAR_HOST_URL and SONAR_TOKEN environment variables.
sonar {
	properties {
		property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'discount-kata'
		property 'sonar.coverage.jacoco.xmlReportPaths',
				layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
	}
}

dependencyCheck {
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
	// Fail on high and critical vulnerabilities only.
	failBuildOnCVSS = 7.0f
	formats = ['HTML', 'JSON']
	analyzers {
		assemblyEnabled = false
		ossIndex {
			enabled = false
		}
	}
}
